
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "is2-tpfi"
version = "0.1.0"
description = "Trabajo Practico Final Integrador de Ingenieria de Software II"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "boto3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "pyright",
    "bandit",
    "pdoc",
    "boto3-stubs[dynamodb]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/is2_tpfi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["is2_tpfi"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
